# ============================================================================
# Pipeline de integracion continua en GitHub Actions
# Se ejecuta en cada push y en cada pull request sobre las ramas main/develop.
# ============================================================================
name: CI - Gestor de Tareas

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r app/requirements.txt

      - name: Ejecutar pruebas
        working-directory: app
        run: python -m pytest tests/ -v

  contenedores:
    name: Construir y validar los dos contenedores
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Construir las imagenes
        run: docker compose build

      - name: Levantar los contenedores
        run: docker compose up -d

      - name: Esperar a que el servicio web responda
        run: |
          for intento in $(seq 1 30); do
            if curl -fs http://localhost:8080/health > /dev/null; then
              echo "Servicio disponible"
              exit 0
            fi
            echo "Intento $intento: esperando..."
            sleep 3
          done
          echo "El servicio no respondio a tiempo"
          docker compose logs
          exit 1

      - name: Verificar la comunicacion entre contenedores
        run: curl -fs http://localhost:8080/health | tee /dev/stderr | grep -q '"comunicacion_contenedores": *"establecida"'

      - name: Verificar la lectura de datos desde PostgreSQL
        run: curl -fs http://localhost:8080/api/tareas | tee /dev/stderr | grep -q '"total"'

      - name: Apagar los contenedores
        if: always()
        run: docker compose down -v
